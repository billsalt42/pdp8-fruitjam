# PDP-8/E emulator settings (Adafruit Fruit Jam)
# system to boot at power-up: os8, tss8 (DEC TSS/8.24) or uwm (UWM TSS/8.25)
system=os8
# RK05 cartridge images for OS/8 (root of the card, SIMH format)
rk0=os8.rk05
rk1=blank.rk05
rk2=ock.rk05
rk3=
# TSS/8: INIT paper tape (BIN format) and RF08 fixed-head disk image
tss8_bin=tss8_init.bin
tss8_rf=tss8_rf.dsk
# UWM TSS/8.25: INIT tape and RF08 disk image
uwm_bin=uwm_init.bin
uwm_rf=uwm_rf.dsk
# green, amber, white or blue
color=green
# fold keyboard input to upper case (Caps Lock also toggles it)
uppercase=on
# full = as fast as possible, real = about the speed of a real PDP-8/E
speed=full
# seconds before booting automatically (-1 = wait for Enter)
autoboot=3
